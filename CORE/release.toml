# Release packaging metadata for the generic M2M make_release.py tool.

[core]
file_base = "gbc4mega65"
display_name = "Game Boy for MEGA65"

[version]
check = "core_version_constant"
file = "CORE/vhdl/config.vhd"
constant = "CORE_VERSION"

[cor]
bit2core_tail = ""
coretool_flags = ""
coretool_caps = ""

[shell_config]
enabled = true
filename = "gbc4mega65-{version}.cfg"

[release_notes]
versions_md = "required"

[alpha]
inofficial_md = "skip"

[cleanup]
stale_files = []
